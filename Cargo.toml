[package]
name = "apollo-os"
version = "0.1.0"
edition = "2021"
authors = ["APOLLO Kernel Team"]
description = "Byzantine-Resilient, Formally-Verified Microkernel OS"
license = "GPL-3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false

[profile.dev]
opt-level = 0

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "apollo-kernel"
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
spin = { version = "0.9", default-features = false }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }

[features]
default = ["kernel-core"]
kernel-core = []
hypervisor = []
